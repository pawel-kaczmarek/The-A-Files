<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The A-Files evaluation architecture</title>
  <desc id="d">A cover signal and a seeded payload are embedded, attacked and decoded by a fresh decoder; BER measures recovery, quality metrics compare cover with stego, a steganalyser measures detectability, and per-file statistics summarise the run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b6b73"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d5dde0; stroke-width: 1.5; }
      .hl { stroke: #183c4a; stroke-width: 2; }
      .icon { fill: none; stroke: #183c4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon.g { stroke: #1baf7a; }
      .icon.a { stroke: #eb6834; }
      .h { font-size: 15px; font-weight: 600; fill: #0e1116; }
      .s { font-size: 12px; fill: #5b6b73; }
      .m { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 12px; fill: #183c4a; }
      .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #5b6b73; }
      .flow { fill: none; stroke: #5b6b73; stroke-width: 1.6; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="960" height="400" rx="16" fill="#f5f5f1"/>

  <!-- Brand mark -->
  <g transform="translate(24 20) scale(.2)">
    <mask id="gap"><rect width="84" height="100" fill="#fff"/><rect y="58" width="84" height="10" fill="#000"/></mask>
    <g fill="#0e1116" mask="url(#gap)">
      <rect x="0" y="75" width="7" height="25"/><rect x="11" y="50" width="7" height="50"/>
      <rect x="22" y="25" width="7" height="75"/><rect x="33" y="0" width="7" height="100"/>
      <rect x="44" y="0" width="7" height="100"/><rect x="55" y="25" width="7" height="75"/>
      <rect x="66" y="50" width="7" height="50"/><rect x="77" y="75" width="7" height="25"/>
    </g>
    <rect x="33" y="60" width="18" height="6" fill="#1baf7a"/>
  </g>
  <text x="48" y="37" class="h">The A-Files</text>
  <text x="140" y="37" class="s">one trial · file is the unit of replication</text>

  <!-- Payload -->
  <g transform="translate(216 58)">
    <rect width="150" height="34" rx="17" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.5"/>
    <g fill="#1baf7a">
      <rect x="16" y="11" width="6" height="12" rx="1"/><rect x="26" y="15" width="6" height="8" rx="1" opacity=".35"/>
      <rect x="36" y="11" width="6" height="12" rx="1"/><rect x="46" y="11" width="6" height="12" rx="1"/>
      <rect x="56" y="15" width="6" height="8" rx="1" opacity=".35"/>
    </g>
    <text x="72" y="22" class="m">m, seed</text>
  </g>
  <path class="flow" d="M291 92v20"/>

  <!-- Main row -->
  <text x="24" y="104" class="lbl">TRIAL</text>

  <!-- Cover -->
  <g transform="translate(24 116)">
    <rect class="card" width="150" height="96" rx="12"/>
    <path class="icon" transform="translate(16 16)" d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/>
    <text x="16" y="66" class="h">Cover x</text>
    <text x="16" y="84" class="s">WAV · FLAC · corpora</text>
  </g>

  <!-- Embed -->
  <g transform="translate(216 116)">
    <rect class="card hl" width="150" height="96" rx="12"/>
    <g class="icon g" transform="translate(16 16)">
      <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
      <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
    </g>
    <text x="16" y="66" class="h">Embed</text>
    <text x="16" y="84" class="m">y = E(x, m)</text>
  </g>

  <!-- Attack -->
  <g transform="translate(408 116)">
    <rect class="card" width="150" height="96" rx="12"/>
    <path class="icon a" transform="translate(16 16)" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
    <text x="16" y="66" class="h">Attack</text>
    <text x="16" y="84" class="m">z = A_θ(y)</text>
  </g>

  <!-- Decode -->
  <g transform="translate(600 116)">
    <rect class="card hl" width="150" height="96" rx="12"/>
    <g class="icon" transform="translate(16 16)">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
    </g>
    <text x="16" y="66" class="h">Decode</text>
    <text x="16" y="84" class="s">fresh decoder → m̂</text>
  </g>

  <!-- BER -->
  <g transform="translate(792 116)">
    <rect class="card" width="144" height="96" rx="12"/>
    <g class="icon g" transform="translate(16 16)">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
    </g>
    <text x="16" y="66" class="h">Reliability</text>
    <text x="16" y="84" class="m">BER(m, m̂)</text>
  </g>

  <path class="flow" d="M174 164h40"/>
  <path class="flow" d="M366 164h40"/>
  <path class="flow" d="M558 164h40"/>
  <path class="flow" d="M750 164h40"/>

  <!-- Measurement row -->
  <text x="24" y="254" class="lbl">MEASUREMENT</text>

  <!-- Quality -->
  <g transform="translate(216 266)">
    <rect class="card" width="150" height="96" rx="12"/>
    <g class="icon" transform="translate(16 16)"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
    <text x="16" y="66" class="h">Transparency</text>
    <text x="16" y="84" class="s">PESQ · STOI · SNR (x, y)</text>
  </g>

  <!-- Steganalysis -->
  <g transform="translate(408 266)">
    <rect class="card" width="150" height="96" rx="12"/>
    <g class="icon" transform="translate(16 16)">
      <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>
    </g>
    <text x="16" y="66" class="h">Detectability</text>
    <text x="16" y="84" class="s">held-out steganalyser</text>
  </g>

  <!-- Statistics -->
  <g transform="translate(600 266)">
    <rect class="card hl" width="336" height="96" rx="12"/>
    <g class="icon" transform="translate(16 16)">
      <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
    </g>
    <text x="16" y="66" class="h">Statistics &amp; reports</text>
    <text x="16" y="84" class="s">cluster bootstrap · Wilcoxon/Friedman + Holm · Pareto</text>
    <g transform="translate(236 18)">
      <rect x="0" y="24" width="10" height="16" rx="2" fill="#2a78d6"/>
      <rect x="16" y="12" width="10" height="28" rx="2" fill="#eb6834"/>
      <rect x="32" y="4" width="10" height="36" rx="2" fill="#1baf7a"/>
      <rect x="48" y="16" width="10" height="24" rx="2" fill="#eda100"/>
      <rect x="64" y="8" width="10" height="32" rx="2" fill="#4a3aa7"/>
    </g>
  </g>

  <path class="flow dash" d="M99 212v102h115"/>
  <path class="flow dash" d="M291 212v52"/>
  <path class="flow dash" d="M320 212c0 30 150 20 163 52"/>
  <path class="flow dash" d="M864 212v52"/>
  <path class="flow dash" d="M366 314h40M558 314h40"/>
</svg>
